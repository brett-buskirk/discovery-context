# Keeps dependencies current with small, reviewable pull requests. Every update still goes through CI and
# AgentGate, and is merged by a human like any other change.
version: 2
updates:
  # npm: all devDependencies (the site ships no runtime dependencies).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch bumps together in one PR; majors arrive one at a time so each can be reviewed.
      dev-minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions. The workflows pin actions to commit SHAs; Dependabot updates the SHA and the tag comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
