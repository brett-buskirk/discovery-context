name: CI
on:
  pull_request:
  push:
    branches: [main]

# Read-only: this job only builds and tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The page will hold a live API key, so no SDK (or other package) code may ship in the bundle.
      - name: Check the bundle contains no SDK code
        run: |
          if grep -rl "@anthropic-ai" dist/; then
            echo "::error::SDK code found in dist/. Imports from @anthropic-ai/sdk must be type-only."
            exit 1
          fi
